name: Sync SDK Compliance Matrix

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: supabase/sdk/.github/workflows/sync-sdk-compliance.yml@a87c7cad984b0d8d48983d64d93095de257841bd # capability-matrix/v2.1.0
    with:
      base-branch: master
    secrets:
      client-id: ${{ secrets.APP_CLIENT_ID }}
      private-key: ${{ secrets.PRIVATE_KEY }}
